<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Construction Cost Estimate – RB HOME LAOS</title>
<meta name="description" content="Free construction cost estimate for modern houses in Vientiane – RB HOME LAOS. ປະເມີນລາຄາກໍ່ສ້າງເຮືອນ ຟຣີ.">
<meta property="og:title" content="RB HOME LAOS – Construction Cost Estimate">
<meta property="og:image" content="https://rbhomelaos.github.io/img/villa-modern.jpg">
<meta name="theme-color" content="#0a1a36">
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Noto+Sans+Lao:wght@300;400;500;600;700&family=Noto+Serif+Lao:wght@500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1a36;--navy-2:#10264d;--gold:#d4a84b;--gold-2:#f1d38a;--gold-3:#a87d2a;--ink:#121a2b;--muted:#5d6678;--line:#e6e1d6;--paper:#faf8f3;
--grad-gold:linear-gradient(135deg,#f6dc95 0%,#d4a84b 45%,#a87d2a 100%);--shadow:0 20px 50px -20px rgba(10,26,54,.35);
--sans:"Be Vietnam Pro","Noto Sans Lao","Noto Sans SC",system-ui,sans-serif;--serif:"Playfair Display","Noto Serif Lao","Noto Serif SC",Georgia,serif}
html:lang(lo){--sans:"Noto Sans Lao","Be Vietnam Pro",system-ui,sans-serif;--serif:"Noto Serif Lao","Playfair Display",serif}
html:lang(zh){--sans:"Noto Sans SC","Be Vietnam Pro",system-ui,sans-serif;--serif:"Noto Serif SC","Playfair Display",serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{width:min(1200px,100% - 40px);margin-inline:auto}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2}
.gold-text{background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
.eyebrow::before{content:"";width:34px;height:1px;background:currentColor}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 24px;border-radius:999px;font:600 .95rem var(--sans);cursor:pointer;border:0;transition:.25s}
.btn-gold{background:var(--grad-gold);color:var(--navy);box-shadow:0 10px 30px -10px rgba(212,168,75,.7)}
.btn-gold:hover{transform:translateY(-2px)}
.btn-line{border:1px solid var(--navy);color:var(--navy);background:#fff}
.btn-wa{background:#25d366;color:#fff}
header{background:var(--navy);position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(212,168,75,.25)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:14px}
.brand{display:flex;align-items:center;gap:10px;color:#fff}
.brand img{height:34px}.brand b{font-family:"Playfair Display",serif;letter-spacing:.06em;white-space:nowrap}
.tools{display:flex;gap:10px;align-items:center}
.back{color:#cfd6e6;font-size:.85rem}
.back:hover{color:var(--gold)}
.lang{display:flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:3px}
.lang button{background:none;border:0;color:#cfd6e6;font:600 .72rem/1 var(--sans);padding:8px 10px;border-radius:999px;cursor:pointer}
.lang button.active{background:var(--grad-gold);color:var(--navy)}
.hero{background:linear-gradient(100deg,rgba(10,26,54,.97),rgba(10,26,54,.75)),url(img/villa-modern.jpg) center/cover;color:#fff;padding:70px 0 120px}
.hero h1{font-size:clamp(2rem,4.4vw,3.4rem);margin:14px 0 14px;max-width:760px}
.hero p{color:#c3cbe0;max-width:640px;font-size:1.05rem}
.layout>*{min-width:0}
.layout{display:grid;grid-template-columns:420px 1fr;gap:28px;margin-top:-80px;align-items:start;padding-bottom:80px}
.panel{background:#fff;border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.form{padding:28px;position:sticky;top:88px}
.form h3{font-family:var(--sans);font-size:.95rem;font-weight:700;color:var(--navy);margin:22px 0 12px;letter-spacing:.02em}
.form h3:first-child{margin-top:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:5px}
select,input[type=number]{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font:600 1rem var(--sans);color:var(--ink);background:#fbfaf7;outline:none}
select:focus,input[type=number]:focus{border-color:var(--gold);background:#fff}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 6px;font:600 .9rem var(--sans);cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pkgs{display:grid;gap:10px}
.pkg{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px;position:relative;transition:.2s}
.pkg.on{border-color:var(--gold);background:linear-gradient(135deg,#fffaf0,#fff);box-shadow:0 8px 24px -14px rgba(168,125,42,.6)}
.pkg b{font-size:1rem}.pkg .pr{font-family:"Playfair Display",serif;font-size:1.25rem;color:var(--gold-3);font-weight:700;text-align:right}
.pkg small{grid-column:1/-1;color:var(--muted);font-size:.78rem;line-height:1.4}
.pkg .tag{position:absolute;top:-9px;right:12px;background:var(--grad-gold);color:var(--navy);font-size:.62rem;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.06em;text-transform:uppercase}
details{border-top:1px dashed var(--line);margin-top:18px;padding-top:4px}
summary{cursor:pointer;font-weight:700;font-size:.95rem;color:var(--navy);padding:12px 0;list-style:none}
summary::after{content:" +";color:var(--gold-3)}
details[open] summary::after{content:" –"}
.chk{display:flex;align-items:center;gap:10px;font-size:.9rem;padding:6px 0;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--gold-3)}
.form .btn{width:100%;margin-top:20px}
.err{color:#b42318;font-size:.85rem;margin-top:10px;display:none}
.result{padding:30px;min-height:400px}
.r-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-end;padding-bottom:20px;border-bottom:1px solid var(--line)}
.r-head h2{font-size:1.6rem}
.r-head small{color:var(--muted)}
.total-box{background:var(--navy);color:#fff;border-radius:16px;padding:20px 24px;margin:22px 0;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px;position:relative;overflow:hidden}
.total-box::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--grad-gold)}
.total-box span{display:block;font-size:.75rem;color:#9fabc7;text-transform:uppercase;letter-spacing:.08em}
.total-box .big{font-family:"Playfair Display",serif;font-size:clamp(1.8rem,3.4vw,2.5rem);font-weight:700}
.total-box .mid{font-size:1.2rem;font-weight:600;margin-top:4px}
.total-box .kip{color:#c3cbe0;font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat{background:#fbfaf7;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat span{font-size:.74rem;color:var(--muted);display:block}
.stat b{font-size:1.02rem}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:620px}
th{background:var(--navy);color:#fff;text-align:left;font-weight:600;padding:11px 12px;font-size:.8rem}
td{padding:9px 12px;border-bottom:1px solid #efebe2;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.grp td{background:#f4efe3;font-weight:700;color:var(--navy)}
tr.sub td{font-weight:700;background:#fbfaf7}
tr.tot td{background:var(--navy);color:var(--gold-2);font-weight:700;font-size:.98rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}
.box{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#fbfaf7}
.box h4{font-size:.9rem;color:var(--navy);margin-bottom:10px}
.pay{display:flex;justify-content:space-between;gap:10px;font-size:.84rem;padding:5px 0;border-bottom:1px dashed #e7e1d2}
.pay:last-child{border:0}
.box p{font-size:.84rem;color:var(--muted);margin-bottom:8px}
.note{font-size:.8rem;color:var(--muted);margin-top:18px;font-style:italic}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.empty{display:grid;place-items:center;text-align:center;color:var(--muted);min-height:360px}
.empty img{width:110px;opacity:.9;margin:0 auto 14px}
.print-head{display:none}
@media (max-width:980px){.layout{grid-template-columns:1fr}.form{position:static}.total-box{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.wrap{width:calc(100% - 32px)}.cols{grid-template-columns:1fr}.result,.form{padding:20px}.brand b{display:none}.lang button{padding:7px 7px;font-size:.66rem}.back{display:none}}
@media print{
  header,.hero,.form,.actions,.lang{display:none!important}
  body{background:#fff}
  .layout{display:block;margin:0;padding:0}
  .panel{box-shadow:none;border:0}
  .result{padding:0}
  .print-head{display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--gold);padding-bottom:10px;margin-bottom:12px}
  .print-head img{height:46px;background:var(--navy);padding:6px;border-radius:6px}
  table{min-width:0;font-size:10.5pt}
  .total-box,th,tr.tot td,tr.grp td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tbl-wrap{overflow:visible}
}
</style>
</head>
<body>
<header><div class="wrap nav">
  <a class="brand" href="index.html"><img src="img/logo-mark.png" alt="RB HOME LAOS"><b>RB HOME LAOS</b></a>
  <div class="tools">
    <a class="back" href="index.html" data-t="back"></a>
    <div class="lang"><button data-lang="lo">ລາວ</button><button data-lang="en">EN</button><button data-lang="vi">VI</button><button data-lang="zh">中文</button></div>
  </div>
</div></header>

<section class="hero"><div class="wrap">
  <span class="eyebrow" data-t="eyebrow"></span>
  <h1 data-th="h1"></h1>
  <p data-t="lead"></p>
</div></section>

<div class="wrap layout">
  <form class="panel form" id="f" novalidate>
    <h3 data-t="sInput"></h3>
    <div class="row">
      <div><label for="w" data-t="width"></label><input type="number" id="w" min="1" max="200" step="0.1" inputmode="decimal" placeholder="10" required></div>
      <div><label for="l" data-t="length"></label><input type="number" id="l" min="1" max="200" step="0.1" inputmode="decimal" placeholder="20" required></div>
    </div>
    <label style="margin-top:14px" data-t="floors"></label>
    <div class="seg" id="floors"><button type="button" data-v="1">1</button><button type="button" data-v="2" class="on">2</button><button type="button" data-v="3">3</button><button type="button" data-v="4">4</button></div>

    <div class="row" style="margin-top:14px">
      <div><label for="fd" data-t="fdL"></label><select id="fd"></select></div>
      <div><label for="rf" data-t="rfL"></label><select id="rf"></select></div>
    </div>
    <label class="chk" style="margin-top:6px"><input type="checkbox" id="tum"><span data-t="tumL"></span></label>

    <h3 data-t="sPkg"></h3>
    <div class="pkgs" id="pkgs"></div>

    <details>
      <summary data-t="sAdv"></summary>
      <div class="row">
        <div><label for="hw" data-t="hw"></label><input type="number" id="hw" min="3" step="0.1"></div>
        <div><label for="hl" data-t="hl"></label><input type="number" id="hl" min="3" step="0.1"></div>
        <div><label for="br" data-t="br"></label><input type="number" id="br" min="1" max="10" step="1"></div>
        <div><label for="wc" data-t="wcl"></label><input type="number" id="wc" min="1" max="12" step="1"></div>
      </div>
    </details>
    <details open>
      <summary data-t="sExt"></summary>
      <label class="chk"><input type="checkbox" id="xfence" checked><span data-t="xfence"></span></label>
      <label class="chk"><input type="checkbox" id="xgate" checked><span data-t="xgate"></span></label>
      <label class="chk"><input type="checkbox" id="xyard" checked><span data-t="xyard"></span></label>
      <label class="chk"><input type="checkbox" id="xgarden"><span data-t="xgarden"></span></label>
      <label class="chk"><input type="checkbox" id="xdrain" checked><span data-t="xdrain"></span></label>
      <div class="row" style="margin-top:8px">
        <div><label for="xcarport" data-t="xcarport"></label><input type="number" id="xcarport" min="0" step="1" placeholder="0"></div>
        <div><label for="xfill" data-t="xfill"></label><input type="number" id="xfill" min="0" max="3" step="0.1" placeholder="0"></div>
      </div>
    </details>
    <button class="btn btn-gold" type="submit" data-t="calc"></button>
    <p class="err" id="err" data-t="errLand"></p>
  </form>

  <section class="panel result" id="result" aria-live="polite">
    <div class="empty"><div><img src="img/logo-gold.png" alt=""><p data-t="lead"></p></div></div>
  </section>
</div>

<script src="js/estimate-config.js"></script>
<script src="js/estimate-engine.js"></script>
<script src="js/estimate-i18n.js"></script>
<script src="js/estimate-ui.js"></script>
</body>
</html>
